name: fyp_flutter_app
description: "Find Your Place Flutter App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:

  circular_menu: ^4.0.0
  flutter:
    sdk: flutter
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.0
  path: ^1.9.1
  sliding_up_panel: ^2.0.0+1
  sqflite: ^2.4.2+1
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_gen: ^5.15.0
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  crypto: ^3.0.7
  flutter_colorpicker: ^1.1.0
  in_app_purchase: ^3.2.0
  provider: ^6.1.5+1
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/find_your_place_logo.png
    - .env
  generate: true